name: 기능 추가 및 개선 (Feature & Enhancement)
description: 새로운 기능 또는 기존 기능 개선을 요청합니다.
title: "[Feat]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 작업 배경 및 목적
      description: 해결하고자 하는 문제나 이 작업이 필요한 이유를 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: 상세 내용 및 요구사항
      description: 구체적인 화면/동작 요구사항 또는 관련 기획(`plan/plan.md` 등)을 명시해 주세요.
    validations:
      required: true
  - type: textarea
    id: target-modules
    attributes:
      label: 영향 모듈 / 범위 (선택)
      placeholder: "예: :feature:home, :core:data, :core:model 등"
  - type: textarea
    id: checklist
    attributes:
      label: 작업 체크리스트 (선택)
      placeholder: |
        - [ ] UI 컴포넌트 구현
        - [ ] ViewModel 및 StateFlow 연동
        - [ ] 단위 테스트 작성
