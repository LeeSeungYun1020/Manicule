name: 빌드 및 환경 설정 (Build & Chore)
description: Gradle 빌드 로직, 의존성(BoM) 업데이트, 정적 분석 도구 설정을 다룹니다.
title: "[Build]: "
labels: ["build"]
body:
  - type: textarea
    id: purpose
    attributes:
      label: 작업 목적
      description: |
        빌드/환경 설정 변경이 필요한 배경을 적어주세요. (예: 의존성 업데이트, ktlint 룰 변경, CI 추가)
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: 변경 상세 내용
      placeholder: |
        - 변경 대상 파일 (예: `build-logic`, `gradle/libs.versions.toml` 등)
        - 변경 내용
    validations:
      required: true
